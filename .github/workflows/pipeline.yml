on:
  schedule:
    # Exucuta as 21:51 hora de Brasília (UTC)
    - cron: '55 00 * * *' 
  workflow_dispatch:

jobs:
  scheduled-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Informalçoes da Schedule
        run: |
          echo "workflow dispaeado por schedule"
          echo "Data e hora: $(date)"
          echo "hora utc: $(date -u)"
          echo "timezone: $(date +%Z)"

      - name: Relatorio diario automatico
        run: |
         echo "RELATRIO DIARIO AUTOMATICO"
         echo "==============================="
         echo "Total de commits: $(git rev-list --all --count)"
         echo "Contribuidores unicos: $(git shortlog -s -n | wc -l)"
         echo "Ultimo commit: $(git log -1 --pretty=format:'%h - %an, %ar : %s')"