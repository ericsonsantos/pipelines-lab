name : "Estrutura de diretorio e Arquivos"

on:
  push:
    branches: [ main]
  workflow_dispatch:

env:
  NODE_VERSION: '18'

jobs:
  demonstrat-estrutura:
    name: "Demonstrar Estrutura Básica"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout do Codigo"
        uses: actions/checkout@v4

      - name: "Monstrar estrutura .github/workflows"
        run: |
          echo "=== ESTRUTURA DO SIRETORIO .github/workflows ==="
          ls -la .github/workflows/
          echo ""
          echo "Total de workflows: $(ls -1 .github/workflows/*.y*ml 2>/dev/null | wc -l)"

      - name: Elementos obrigatorios do workflow
        run: |
          echo "=== ELEMENTOS OBRIGATORIOS DO WORKFLOW ==="
          echo "1. name: Nome do workflow"
          echo "2. on: Eventos que disparam o workflow"
          echo "3. jobs: Conjunto de tarefas a serem executadas"

      - name: Variaveis e contextos
        run: |
          echo "=== VARIAVEIS E CONTEXTOS ==="
          echo "Variavel en: ${{ env.NODE_VERSION }}"
          echo "Respositorio: ${{ github.repository }}"
          echo " Branch: ${{ github.ref_name }}"
          echo "Actor: ${{ github.actor }}"