name: Hello github Actions

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:


jobs:
  hello-gob:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Executar Hello world
        run: echo "Hello Github Actions"

      - name: Exibir informações do sistema
        run: |
          echo "Sistema operacional: ${{ runner.os }}"
          echo "Diretorio atual: $(pwd)"
          echo "Data atual: $(date)"
          echo "Usuario atual: $(whoami)"

      - name: Listar arquivos do repositorio
        run: ls -la

      - name: Comandos multiplos
        run: |
          echo "Este é o lab 01 do curso de Github Actions"
          echo "Workflows executado com sucesso"
          echo "Pronto para os proximos desafios"