name: "Estrutura de diretorios e arquivos"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main]
  workflow_dispatch:

env:
  NODE_VERSION: '18'

jobs:
  demonstrando-estrutura:
    name: "Demonstrando Estrutura Básica"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout do Código"
        uses: actions/checkout@v4

      - name: "Mostrar estrutura .github/workflows"
        run: |
          echo " == ESTRUTURA DE DIRETORIOS E ARQUIVOS .github/workflows =="
          ls -la .github/workflows
          echo ""
          echo " total de workflows: $(ls -l .github/workflows | wc -l) "

      - name: Elementos obrigatorios do workflow
        run: |
          echo " == ELEMENTOS OBRIGATORIOS DO WORKFLOW =="
          echo " 1. name: Nome do workflow"
          echo " 2. on: Evento que dispara o workflow"
          echo " 3. jobs: Definição dos trabalhos a serem executados"
          echo " 4. runs-on: Ambiente de execução do trabalho"
          echo " 5. steps: Passos a serem executados dentro do trabalho"
          echo ""
          echo " Total de elementos obrigatórios: 5"

      - name: Váriaveis e Contexto do Workflow
        run: |
          echo " == VARIAVEIS E CONTEXTO DO WORKFLOW =="
          echo " Variáveis env: ${{ env.NODE_VERSION }}"
          echo " 1. env: Variáveis de ambiente"
          echo " 2. context: Contexto do workflow"
          echo ""
          echo " Total de elementos opcionais: 2"